<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Header portal siswa ORBIDU</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Poppins',system-ui,sans-serif}
a:focus-visible,button:focus-visible{outline:3px solid #F1AD00;outline-offset:-3px}
</style>
</helmet>
<header style="width: 1440px; height: 72px; box-sizing: border-box; padding: 0 40px; display: flex; align-items: center; gap: 36px; background: #FFFFFF; border-bottom: 1px solid #E3E9F3; font-family: 'Poppins', system-ui, sans-serif">
<a href="Home-Desktop.dc.html" aria-label="ORBIDU, ke beranda" style="display: flex; align-items: center; gap: 10px; text-decoration: none">
<svg width="30" height="30" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="9.5" fill="#0965FA"></circle><ellipse cx="17" cy="18" rx="15" ry="5" fill="none" stroke="#FF7000" stroke-width="2.6" transform="rotate(-18 17 18)"></ellipse></svg>
<span style="font-size: 21px; font-weight: 700; letter-spacing: 0.3px; color: #101A33">ORBIDU</span>
</a>
<nav aria-label="Menu portal" style="display: flex; align-items: stretch; height: 72px; gap: 2px">
<sc-for list="{{items}}" as="n" hint-placeholder-count="6">
<a href="{{n.href}}" aria-current="{{n.current}}" style="height: 72px; box-sizing: border-box; padding: 0 12px; display: flex; align-items: center; gap: 8px; border-bottom: 2px solid {{n.line}}; color: {{n.fg}}; font-size: 14px; font-weight: {{n.weight}}; text-decoration: none; white-space: nowrap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"></path></svg>{{n.label}}<sc-if value="{{n.menu}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></sc-if></a>
</sc-for>
</nav>
<div style="margin-left: auto; display: flex; align-items: center; gap: 12px">
<button type="button" aria-label="Notifikasi, 1 belum dibaca" style="position: relative; width: 44px; height: 44px; border-radius: 12px; border: 1px solid #E3E9F3; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#15234D" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 1112 0v5l1.5 2h-15zM10 20a2 2 0 004 0"></path></svg><span style="position: absolute; top: 10px; right: 11px; width: 8px; height: 8px; border-radius: 50%; background: #FF7000; border: 2px solid #FFFFFF"></span></button>
<button type="button" aria-label="Menu akun Ahmad Rizki" style="height: 48px; padding: 0 10px 0 6px; display: flex; align-items: center; gap: 10px; border-radius: 14px; border: 1px solid #E3E9F3; background: #FFFFFF; font-family: inherit; cursor: pointer">
<span style="width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #0965FA, #00B2DD); color: #FFFFFF; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center">AR</span>
<span style="display: flex; flex-direction: column; align-items: flex-start; line-height: 1.25"><span style="font-size: 14px; font-weight: 600; color: #101A33">Ahmad Rizki</span><span style="font-size: 12px; color: #4A5877">Kelas XII</span></span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4A5877" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
</button>
</div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"aktif":{"editor":"enum","options":["dashboard","analisis","compass","action","persiapan","jurusan"],"default":"dashboard"},"$preview":{"width":1440,"height":72}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.aktif ?? 'dashboard';
    const NAV = [
      { id: 'dashboard', label: 'Dashboard', href: 'Portal-Dashboard.dc.html', icon: 'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z' },
      { id: 'analisis', label: 'Analisis Potensi', href: 'Portal-Analisis.dc.html', icon: 'M10 12a4 4 0 100-8 4 4 0 000 8zM3 20c.8-3.5 3.6-5.5 7-5.5M17.5 19.5a2.5 2.5 0 100-5 2.5 2.5 0 000 5zM21 21l-1.5-1.5' },
      { id: 'compass', label: 'ORBIDU Compass', href: '#', icon: 'M12 21a9 9 0 100-18 9 9 0 000 18zM15.5 8.5l-2 5-5 2 2-5z' },
      { id: 'action', label: 'Action Plan', href: '#', icon: 'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4M9 15l2 2 4-4' },
      { id: 'persiapan', label: 'Persiapan', href: '#', icon: 'M12 21a9 9 0 100-18 9 9 0 000 18zM12 16a4 4 0 100-8 4 4 0 000 8zM12 12h.01', menu: true },
      { id: 'jurusan', label: 'Explore Jurusan', href: 'Home-Desktop.dc.html', icon: 'M11 18a7 7 0 100-14 7 7 0 000 14zM20 20l-3.5-3.5' }
    ];
    return {
      items: NAV.map((n) => {
        const on = n.id === active;
        return { ...n, menu: !!n.menu, current: on ? 'page' : 'false', line: on ? '#0965FA' : 'transparent', fg: on ? '#0965FA' : '#4A5877', weight: on ? 600 : 500 };
      })
    };
  }
}
</script>
</body>
</html>
