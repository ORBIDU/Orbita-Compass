services:
  # 1. AI Engine Microservice (FastAPI + Gemini)
  - type: web
    name: orbidu-ai-engine
    runtime: python
    rootDir: ai-engine
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false

  # 2. Backend REST API (Node.js + Express + Prisma)
  - type: web
    name: orbidu-backend-api
    runtime: node
    rootDir: backend-api
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: node dist/server.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AI_ENGINE_URL
        fromService:
          type: web
          name: orbidu-ai-engine
          property: host
